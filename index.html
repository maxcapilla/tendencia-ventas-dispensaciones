    async function decryptSite(code) {
      const material = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(code.trim().toUpperCase()),
        { name: "PBKDF2" },
        false,
        ["deriveKey"]
      );
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: fromBase64(protectedContent.salt), iterations: protectedContent.iterations, hash: "SHA-256" },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
      const decrypted = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: fromBase64(protectedContent.iv) },
        key,
        fromBase64(protectedContent.ciphertext)
      );
      return new TextDecoder().decode(decrypted);
    }


    async function decryptPayloadObject(payload, code) {
      const material = await crypto.subtle.importKey(
        "raw", new TextEncoder().encode(code.trim().toUpperCase()),
        { name: "PBKDF2" }, false, ["deriveKey"]
      );
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: fromBase64(payload.salt), iterations: payload.iterations, hash: "SHA-256" },
        material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
      );
      const decrypted = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: fromBase64(payload.iv) },
        key, fromBase64(payload.ciphertext)
      );
      return JSON.parse(new TextDecoder().decode(decrypted));
    }

      return decryptPayloadObject(await response.json(), code);
    }

    // Reject truncated payloads instead of displaying totals with empty detail tables.
    function validatePanelDetails(data) {
      const fail = () => { throw new Error("Los detalles de productos están incompletos o no coinciden con sus totales."); };
      const statuses = ["Sobre PVMP", "En PVMP", "Bajo PVMP"];
      if (!data.pvmp || !Array.isArray(data.pvmp.detail) || !Array.isArray(data.pvmp.pending) ||
          !data.cross || !Array.isArray(data.cross.detail)) fail();
      const seenPrices = new Set();
      data.pvmp.detail.concat(data.pvmp.pending).forEach(x => {
        const key = x.store + ":" + x.id;
        if (!["Rodoviario", "Von Schroeders"].includes(x.store) || !x.id || !x.product || !x.isp ||
            !x.pvmp_status || !Number.isFinite(x.sale) || seenPrices.has(key)) fail();
        seenPrices.add(key);
      });
      data.pvmp.detail.forEach(x => {
        if (!statuses.includes(x.pvmp_status) || !Number.isFinite(x.pvmp) || x.pvmp <= 0 ||
            !Number.isFinite(x.diff) || !Number.isFinite(x.diff_pct) || x.diff !== x.sale - x.pvmp ||
            x.pvmp_status !== (x.diff > 0 ? "Sobre PVMP" : x.diff < 0 ? "Bajo PVMP" : "En PVMP") ||
            Math.abs(x.diff_pct - x.diff / x.pvmp * 100) > 0.011) fail();
      });
      data.pvmp.pending.forEach(x => {
        if (statuses.includes(x.pvmp_status) || x.diff !== null || x.diff_pct !== null ||
            !Array.isArray(x.pvmp_options) || !x.pvmp_options.length ||
            x.pvmp_options.some(n => !Number.isFinite(n) || n <= 0)) fail();
      });
      ["Rodoviario", "Von Schroeders"].forEach(store => {
        const summary = data.pvmp[store];
        if (!summary) fail();
        const rows = data.pvmp.detail.concat(data.pvmp.pending).filter(x => x.store === store);
        const keys = new Set(statuses.concat(Object.keys(summary), rows.map(x => x.pvmp_status)));
        keys.forEach(status => {
          const count = summary[status] || 0;
          if (!Number.isInteger(count) || count < 0) fail();
          if (status !== "Sin PVMP" && rows.filter(x => x.pvmp_status === status).length !== count) fail();
        });
        if (Object.values(summary).reduce((a,b) => a+b, 0) !== data.products[store]) fail();
      });
      const seenStock = new Set();
      data.cross.detail.forEach(x => {
        if (!x.id || !x.product || !x.product_class || !Number.isFinite(x.rod) || !Number.isFinite(x.vs) || seenStock.has(x.id)) fail();
        seenStock.add(x.id);
        if (!(x.type === "Sin stock Rodoviario" && x.rod <= 0 && x.vs > 0) &&
            !(x.type === "Sin stock Von Schroeders" && x.vs <= 0 && x.rod > 0)) fail();
      });
      [["Rodoviario", "rod_missing"], ["Von Schroeders", "vs_missing"]].forEach(([store,key]) => {
        const rows = data.cross.detail.filter(x => x.type === "Sin stock " + store);
        if (rows.length !== data.cross[key] || rows.filter(x => x.product_class === "MEDICAMENTO").length !== data.cross[key + "_medicines"]) fail();
      });
      return data;
    }

    function bindPanelDetails() {
      document.querySelectorAll("[data-pf-target]").forEach(button => {
        button.addEventListener("click", () => {
          const detail = document.getElementById(button.dataset.pfTarget);
          if (!detail) return;
          const open = detail.classList.toggle("open");
          button.setAttribute("aria-expanded", String(open));
          button.textContent = open ? "Ocultar productos" : "Ver productos";
          if (open) {
            detail.scrollIntoView({ block: "start" });
            detail.focus({ preventScroll: true });
          }
        });
      });
    }

        '.pf-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.pf-card{background:#fff;border:1px solid #dce4ed;border-radius:12px;padding:16px;box-shadow:0 5px 16px rgba(28,53,84,.05)}' +
        '.pf-l{font-size:12px;color:#66758a;text-transform:uppercase;font-weight:800}.pf-v{font-size:24px;color:#17263a;font-weight:850;margin-top:5px}.pf-s{font-size:12px;color:#66758a;margin-top:4px}' +
        '.pf-red .pf-v{color:#a72e2e}.pf-green .pf-v{color:#157347}.pf-amber .pf-v{color:#956300}.pf-section{margin-top:30px}.pf-table-wrap{overflow:auto;max-height:520px;border:1px solid #dce4ed;border-radius:12px;background:#fff}.pf-table{width:100%;border-collapse:collapse;font-size:13px}.pf-table th{position:sticky;top:0;background:#1b3a6b;color:#fff;padding:10px;text-align:left}.pf-table td{padding:9px;border-bottom:1px solid #edf1f5}.pf-btn{margin-top:8px;border:1px solid #c9d5e2;background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer;font-weight:700}.pf-detail{display:none;margin-top:12px;scroll-margin-top:110px}.pf-detail:focus{outline:2px solid #2563c7}.pf-btn{color:#17263a}.pf-empty{text-align:center;color:#66758a}.pf-pending{margin-top:18px}.pf-pending summary{cursor:pointer;font-weight:700;padding:12px 0}.pf-table th{z-index:1}.pf-table td{white-space:normal;text-align:left}.pf-table td:first-child{font-weight:400}.pf-section{scroll-margin-top:110px}.pf-detail.open{display:block}' +
        '@media(max-width:850px){.pf-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.pf-grid{grid-template-columns:1fr}}' +
        '</style>';
      html = html.replace('</head>', style + '</head>');

      const current =
        '<div class="pf-nav"><b>Panel Farmacias</b><a href="#pf-sep26">SEP26 parcial</a><a href="#pf-historico">Ventas históricas</a><a href="#pf-pvmp">Precios PVMP</a><a href="#pf-inventario">Inventario</a></div>' +
        '<section class="pf-wrap" id="pf-sep26"><h2>Septiembre 2026 · avance al 21/09</h2><div class="pf-muted">Mes parcial. El dashboard histórico mensual original se conserva completo debajo.</div><div class="pf-grid">' +
        '<div class="pf-card"><div class="pf-l">Ventas SEP26 · Consolidado</div><div class="pf-v">' + money(totalSales) + '</div><div class="pf-s">Rodoviario ' + money(r.sales) + ' · Von Schroeders ' + money(v.sales) + '</div></div>' +
        '<div class="pf-card"><div class="pf-l">Dispensaciones SEP26</div><div class="pf-v">' + fmt(totalDisp) + '</div><div class="pf-s">Rodoviario ' + fmt(r.dispensations) + ' · Von Schroeders ' + fmt(v.dispensations) + '</div></div>' +
        '<div class="pf-card"><div class="pf-l">Boleta promedio SEP26</div><div class="pf-v">' + money(totalAvg) + '</div><div class="pf-s">Rodoviario ' + money(r.avg_ticket) + ' · Von Schroeders ' + money(v.avg_ticket) + '</div></div>' +
        '<div class="pf-card"><div class="pf-l">Corte de información</div><div class="pf-v">21/09</div><div class="pf-s">No comparar como mes cerrado</div></div>' +
        '</div></section><div id="pf-historico"></div>';
      html = html.replace(/<body([^>]*)>/i, function(match){ return match + current; });

      const missingR = data.cross.detail.filter(x => x.type === "Sin stock Rodoviario");
      const missingV = data.cross.detail.filter(x => x.type === "Sin stock Von Schroeders");
      function crossTable(rows) {
        return '<p class="pf-muted">'+fmt(rows.length)+' productos · stock total por ID, sumando todos los lotes. Sin stock: total menor o igual a cero.</p><div class="pf-table-wrap"><table class="pf-table"><thead><tr><th>ID</th><th>Producto</th><th>Clase</th><th>Stock Rodoviario</th><th>Stock Von Schroeders</th></tr></thead><tbody>' +
          (rows.map(function(x){ return '<tr><td>'+escapeHtml(x.id)+'</td><td>'+escapeHtml(x.product)+'</td><td>'+escapeHtml(x.product_class)+'</td><td>'+fmt(x.rod)+'</td><td>'+fmt(x.vs)+'</td></tr>'; }).join('') || '<tr><td class="pf-empty" colspan="5">No hay productos en esta situación.</td></tr>') +
          '</tbody></table></div>';
      }

      const exp = ["Mes entrante","1–3 meses","3–6 meses","6–12 meses"].map(function(b){
        const n=(data.expiries.counts.Rodoviario[b]||0)+(data.expiries.counts["Von Schroeders"][b]||0);
        return '<div class="pf-card"><div class="pf-l">Vence '+b+'</div><div class="pf-v">'+fmt(n)+'</div><div class="pf-s">productos con stock</div></div>';
      }).join('');

      const comparable = data.pvmp.detail.map(function(x){
        return '<tr><td>'+escapeHtml(x.store)+'</td><td>'+escapeHtml(x.id)+'</td><td>'+escapeHtml(x.product)+'</td><td>'+escapeHtml(x.isp)+'</td><td>'+money(x.sale)+'</td><td>'+money(x.pvmp)+'</td><td>'+money(x.diff)+' ('+new Intl.NumberFormat("es-CL", {maximumFractionDigits:2}).format(x.diff_pct)+'%)</td><td>'+escapeHtml(x.pvmp_status)+'</td></tr>';
      }).join('') || '<tr><td class="pf-empty" colspan="8">No hay productos comparables en este período.</td></tr>';
      const pending = data.pvmp.pending.map(function(x){
        return '<tr><td>'+escapeHtml(x.store)+'</td><td>'+escapeHtml(x.id)+'</td><td>'+escapeHtml(x.product)+'</td><td>'+escapeHtml(x.isp)+'</td><td>'+money(x.sale)+'</td><td>'+x.pvmp_options.map(money).join(' / ')+'</td><td>'+escapeHtml(x.pvmp_status)+'</td></tr>';
      }).join('') || '<tr><td class="pf-empty" colspan="7">No hay comparaciones pendientes.</td></tr>';

      const modules =
        '<section class="pf-wrap pf-section" id="pf-pvmp"><h2>Precios PVMP</h2><div class="pf-grid">' +
        '<div class="pf-card pf-red"><div class="pf-l">Sobre PVMP</div><div class="pf-v">'+fmt(over)+'</div><div class="pf-s">cruce exacto por Registro ISP</div></div>' +
        '<div class="pf-card pf-green"><div class="pf-l">En PVMP</div><div class="pf-v">'+fmt(equal)+'</div></div>' +
        '<div class="pf-card"><div class="pf-l">Bajo PVMP</div><div class="pf-v">'+fmt(under)+'</div></div>' +
        '<div class="pf-card pf-amber"><div class="pf-l">Fraccionados pendientes</div><div class="pf-v">'+fmt(frac)+'</div><div class="pf-s">normalizar unidad antes de comparar</div></div>' +
        '</div><h3>Productos comparables</h3><p class="pf-muted">'+fmt(data.pvmp.detail.length)+' registros de producto por farmacia. Cruce exacto por Registro ISP; los fraccionados y PVMP múltiples se muestran aparte.</p><div class="pf-table-wrap"><table class="pf-table"><thead><tr><th>Farmacia</th><th>ID</th><th>Producto</th><th>Registro ISP</th><th>Precio</th><th>PVMP</th><th>Diferencia</th><th>Estado</th></tr></thead><tbody>'+comparable+'</tbody></table></div>' +
        '<details class="pf-pending"><summary>Ver comparaciones pendientes ('+fmt(data.pvmp.pending.length)+')</summary><p class="pf-muted">No se calculan diferencias hasta confirmar la unidad de venta o el PVMP aplicable. Los importes Cenabast conservan la presentación de origen.</p><div class="pf-table-wrap"><table class="pf-table"><thead><tr><th>Farmacia</th><th>ID</th><th>Producto</th><th>Registro ISP</th><th>Precio</th><th>PVMP de origen</th><th>Motivo</th></tr></thead><tbody>'+pending+'</tbody></table></div></details></section>' +
        '<section class="pf-wrap pf-section" id="pf-inventario"><h2>Inventario</h2><div class="pf-grid">' +
        '<div class="pf-card"><div class="pf-l">Valor inventario a costo</div><div class="pf-v">'+money(inventory)+'</div><div class="pf-s">Rodoviario '+money(data.inventory.Rodoviario)+' · Von Schroeders '+money(data.inventory["Von Schroeders"])+'</div></div>' +
        '<div class="pf-card"><div class="pf-l">Sin stock Rodoviario</div><div class="pf-v">'+fmt(data.cross.rod_missing)+'</div><div class="pf-s">disponibles en Von Schroeders · '+fmt(data.cross.rod_missing_medicines)+' medicamentos</div><button type="button" class="pf-btn" data-pf-target="pf-cross-r" aria-controls="pf-cross-r" aria-expanded="false">Ver productos</button></div>' +
        '<div class="pf-card"><div class="pf-l">Sin stock Von Schroeders</div><div class="pf-v">'+fmt(data.cross.vs_missing)+'</div><div class="pf-s">disponibles en Rodoviario · '+fmt(data.cross.vs_missing_medicines)+' medicamentos</div><button type="button" class="pf-btn" data-pf-target="pf-cross-v" aria-controls="pf-cross-v" aria-expanded="false">Ver productos</button></div>' +
        '<div class="pf-card"><div class="pf-l">Registro ISP pendiente</div><div class="pf-v">'+fmt(data.isp.without)+'</div><div class="pf-s">'+fmt(data.isp.with)+' productos ya informados</div></div>' +
        '</div>' +
        '<div id="pf-cross-r" class="pf-detail" tabindex="-1" role="region" aria-label="Productos sin stock en Rodoviario"><h3>Sin stock Rodoviario · disponible en Von Schroeders</h3>'+crossTable(missingR)+'</div>' +
        '<div id="pf-cross-v" class="pf-detail" tabindex="-1" role="region" aria-label="Productos sin stock en Von Schroeders"><h3>Sin stock Von Schroeders · disponible en Rodoviario</h3>'+crossTable(missingV)+'</div>' +
        '<h3>Vencimientos</h3><div class="pf-grid">'+exp+'</div></section>';
      return html.replace(/<\/body>/i, modules + '</body>');
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      message.textContent = "";
      button.disabled = true;
      button.textContent = "Descifrando…";
      try {
        let html = await decryptSite(input.value);
        try {
          const panelData = await loadPanelData(input.value);
          html = enhanceHistoricalDashboard(html, panelData);
        } catch (extraError) {
          console.warn("Se mantiene dashboard histórico sin módulos adicionales.", extraError);
          html = html.replace(/<body([^>]*)>/i, match => match + '<p role="alert" style="padding:16px;margin:16px;border:1px solid #b23a32;background:#fff4f2;color:#812820">No se pudieron cargar los detalles de precios e inventario. Recarga la página para volver a intentarlo. El histórico de ventas sigue disponible.</p>');
        }
        document.open();
        document.write(html);
        document.close();
        bindPanelDetails();
      } catch {
        message.textContent = "Código incorrecto. Comprueba los caracteres e inténtalo nuevamente.";
        button.disabled = false;
        button.textContent = "Ver información";
        input.select();
      }
    });
  </script>
</body>
</html>
